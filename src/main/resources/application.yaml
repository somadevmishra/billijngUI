server:
  port: 7080

spring:
  application:
    name: cafe-ui

ui:

  application:
    name: Cafe Billing
    company: ABC Cafe Billing
    version: 1.0.0

  branding:
    logo: /images/logo.png
    favicon: /images/favicon.ico

  icons:
    dashboard: bi-speedometer2
    category: bi-tags-fill
    item: bi-cup-hot-fill
    bill: bi-receipt
    report: bi-graph-up
    settings: bi-gear-fill

  formatting:
    currency-symbol: "₹"
    date-format: "dd-MMM-yyyy"

  pagination:
    page-size: 20

billing:
  api:
    base-url: http://localhost:9080/