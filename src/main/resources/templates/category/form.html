<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main}">

<section layout:fragment="content">

    <!-- ===================================================== -->
    <!-- Page Header -->
    <!-- ===================================================== -->

    <div class="d-flex align-items-center mb-4">

        <div class="bg-primary text-white rounded p-3 me-3">

            <i th:class="${page.icon + ' fs-3'}"></i>

        </div>

        <div>

            <h2 class="mb-1"
                th:text="${page.title}">
                New Category
            </h2>

            <p class="text-muted mb-0"
               th:text="${page.subtitle}">
                Create a new category.
            </p>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- Form -->
    <!-- ===================================================== -->

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header">

                    <strong>

                        <i class="bi bi-info-circle me-2"></i>

                        Category Information

                    </strong>

                </div>

                <div class="card-body">

                    <form>

                        <!-- Category Code (Edit Mode Only) -->

                        <div
                                class="row mb-3"
                                th:if="${page.editMode}">

                            <label
                                    class="col-sm-3 col-form-label">

                                Category Code

                            </label>

                            <div class="col-sm-9">

                                <input
                                        type="text"
                                        class="form-control"
                                        th:value="${page.code}"
                                        readonly>

                            </div>

                        </div>

                        <!-- Category Name -->

                        <div class="row mb-3">

                            <label
                                    for="name"
                                    class="col-sm-3 col-form-label required">

                                Category Name

                            </label>

                            <div class="col-sm-9">

                                <input
                                        id="name"
                                        type="text"
                                        class="form-control"
                                        th:value="${page.name}"
                                        placeholder="Enter category name">

                            </div>

                        </div>

                        <!-- Description -->

                        <div class="row mb-3">

                            <label
                                    for="description"
                                    class="col-sm-3 col-form-label">

                                Description

                            </label>

                            <div class="col-sm-9">

                                <textarea
                                        id="description"
                                        rows="4"
                                        class="form-control"
                                        th:text="${page.description}"
                                        placeholder="Enter description">
                                </textarea>

                            </div>

                        </div>

                        <!-- Active -->

                        <div class="row mb-4">

                            <div class="offset-sm-3 col-sm-9">

                                <div class="form-check">

                                    <input
                                            id="active"
                                            type="checkbox"
                                            class="form-check-input"
                                            th:checked="${page.active}">

                                    <label
                                            class="form-check-label"
                                            for="active">

                                        Active

                                    </label>

                                </div>

                            </div>

                        </div>

                        <hr>

                        <!-- Buttons -->

                        <div class="d-flex justify-content-end">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-floppy me-1"></i>

                                Save

                            </button>

                            <a
                                    th:href="@{/categories}"
                                    class="btn btn-outline-secondary ms-2">

                                <i class="bi bi-arrow-left me-1"></i>

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

</html>
