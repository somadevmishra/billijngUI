<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main}">

<section layout:fragment="content">

    <!-- ========================================================= -->
    <!-- Page Header -->
    <!-- ========================================================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1" th:text="${page.pageTitle}">
                Categories
            </h2>

            <p class="text-muted mb-0">
                Manage all item categories
            </p>
        </div>

        <a th:href="@{/categories/new}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Add Category
        </a>

    </div>

    <!-- ========================================================= -->
    <!-- Search -->
    <!-- ========================================================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3 align-items-end">

                <div class="col-md-6">

                    <label class="form-label">
                        Search
                    </label>

                    <input
                            type="text"
                            class="form-control"
                            placeholder="Search by code or name"
                            th:value="${page.searchText}">

                </div>

                <div class="col-auto">

                    <button class="btn btn-primary">

                        <i class="bi bi-search me-1"></i>

                        Search

                    </button>

                </div>

                <div class="col-auto">

                    <button class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-clockwise me-1"></i>

                        Reset

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ========================================================= -->
    <!-- Category Table -->
    <!-- ========================================================= -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>Code</th>

                        <th>Name</th>

                        <th>Description</th>

                        <th>Status</th>

                        <th class="text-center" style="width: 140px;">
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="category : ${page.categories}">

                        <td th:text="${category.code}">
                            CAT001
                        </td>

                        <td th:text="${category.name}">
                            Beverages
                        </td>

                        <td th:text="${category.description}">
                            Tea & Coffee
                        </td>

                        <td>

                            <span
                                    class="badge"
                                    th:classappend="${category.active} ? ' bg-success' : ' bg-secondary'"
                                    th:text="${category.active} ? 'Active' : 'Inactive'">

                                Active

                            </span>

                        </td>

                        <td class="text-center">

                            <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    title="Edit Category">

                                <i class="bi bi-pencil-square"></i>

                            </button>

                            <button
                                    type="button"
                                    class="btn btn-sm btn-outline-danger ms-1"
                                    title="Delete Category">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(page.categories)}">

                        <td colspan="5" class="text-center text-muted py-4">

                            No categories found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card-footer text-muted">

            Showing

            <strong th:text="${page.totalRecords}">0</strong>

            Categories

        </div>

    </div>

</section>

</html>
