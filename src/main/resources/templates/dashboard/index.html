<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${appName}">Cafe Billing</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
            rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container py-5">

    <div class="text-center">

        <i class="bi bi-cup-hot-fill text-primary display-1"></i>

        <h1 class="mt-3" th:text="${appName}">
            Cafe Billing
        </h1>

        <p class="lead text-muted">
            Welcome to
            <span th:text="${companyName}">Cafe Billing</span>
        </p>

        <p class="text-muted">
            Version
            <span th:text="${appVersion}">1.0.0</span>
        </p>

        <button class="btn btn-primary">
            Bootstrap Works
        </button>

    </div>

</div>

<!-- HTMX -->
<script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js">
</script>

<!-- Bootstrap Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Application JavaScript -->
<script th:src="@{/js/app.js}"></script>

</body>

</html>
